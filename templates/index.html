<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRM Avatar</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!-- Import map must stay in the HTML. It tells the browser where to find three.js and the VRM library. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>

  <body>
    <!-- The character lives in here. The JS reads the model and chat URLs from these data attributes. -->
    <div
      id="avatar"
      data-model="{{ url_for('static', filename='models/character.vrm') }}"
      data-chat-url="{{ url_for('chat') }}"
      data-history-url="{{ url_for('get_history') }}"
      data-reset-url="{{ url_for('reset') }}"
    ></div>

    <div class="chat-panel">
      <!-- Messages appear here -->
      <div id="chats" aria-live="polite"></div>

      <form class="prompt-area" id="prompt-form" autocomplete="off">
        <textarea
          id="prompt"
          name="prompt"
          rows="1"
          placeholder="Say something…"
          aria-label="Message"
        ></textarea>
        <button type="submit" class="send" id="send" aria-label="Send" disabled>
          <ion-icon name="paper-plane"></ion-icon>
        </button>
      </form>
    </div>

    <script
      type="module"
      src="{{ url_for('static', filename='js/avatar.js') }}"
    ></script>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
